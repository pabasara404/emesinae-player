<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emesinae Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(125deg, #2d1b69, #1a1033);
            color: #ffffff;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(168, 139, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        /* Header Section */
        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.18);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.8em;
            font-weight: 300;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.95);
        }

        .search-container {
            position: relative;
            display: flex;
            gap: 15px;
            max-width: 400px;
        }

        #searchBar {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 12px 20px;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            outline: none;
            width: 300px;
        }

        #searchButton {
            background: rgba(168, 139, 255, 0.2);
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            color: white;
            cursor: pointer;
        }

        /* Search Results Dropdown */
        #searchResults {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 12px;
            margin-top: 5px;
            z-index: 1000;
            list-style: none;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        #searchResults li {
            padding: 12px 20px;
            cursor: pointer;
        }

        #searchResults li:hover {
            background: rgba(168, 139, 255, 0.2);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        #musicList {
            list-style: none;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        #musicList li {
            padding: 15px 20px;
            margin: 8px 0;
            background: rgba(168, 139, 255, 0.1);
            border-radius: 12px;
            cursor: pointer;
        }

        #musicList li:hover {
            background: rgba(168, 139, 255, 0.2);
        }

        /* Player Section */
        .player-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.18);
            padding: 20px;
            position: sticky;
            bottom: 0;
        }

        #nowPlaying {
            text-align: center;
            margin-bottom: 10px;
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.8);
        }

        .player-container {
            margin-bottom: 15px;
        }

        #audioPlayer {
            background: #333333;
            color: #ffcc00; /* Audio player's text color */
            border-radius: 10px;
            width: 100%;
            height: 40px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding-top: 15px;
        }

        .controls button {
            background: rgba(168, 139, 255, 0.2);
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            min-width: 100px;
            font-size: 0.9em;
        }

        .controls button:hover {
            background: rgba(168, 139, 255, 0.4);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(168, 139, 255, 0.3);
            border-radius: 3px;
        }

        /* Media Queries */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
            }

            .search-container {
                width: 100%;
            }

            #searchBar {
                width: 100%;
            }

            .controls {
                flex-wrap: wrap;
            }

            .controls button {
                min-width: 80px;
                font-size: 0.8em;
            }
        }

        #waveform {
            margin: 20px 0;
        }
    </style>
    <script src="https://unpkg.com/wavesurfer.js"></script>
</head>
<body>
<div class="header">
    <h1 class="logo">Emesinae Player</h1>
    <div class="search-container">
        <input type="text" id="searchBar" placeholder="Search for a song..." />
        <button id="searchButton">Search</button>
        <ul id="searchResults"></ul>
    </div>
</div>

<div class="main-content">
    <ul id="musicList"></ul>
</div>

<div class="player-section">
    <div id="nowPlaying">Now Playing: None</div>
    <div class="player-container">
        <div id="waveform"></div>
        <audio id="audioPlayer" controls></audio>
    </div>
            <div class="controls">
                <button id="shuffleButton">Shuffle</button>
                <button id="previousButton">Previous</button>
                <button id="playButton">Play</button>
                <button id="pauseButton">Pause</button>
                <button id="nextButton">Next</button>
                <button id="repeatButton">Repeat Off</button>
                <button id="selectFolder">Select Folder</button>
            </div>



</div>

<div id="albumArt"></div>

<script src="renderer.js"></script>
</body>
</html>
